<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" role="img" aria-labelledby="title desc">
  <title id="title">Prestige Live RP</title>
  <desc id="desc">Gold royal crown above the Prestige wordmark, with Live RP beneath.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".24" stop-color="#e9bd58"/>
      <stop offset=".52" stop-color="#b9822d"/>
      <stop offset=".76" stop-color="#f4d477"/>
      <stop offset="1" stop-color="#95601d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6a27"/>
      <stop offset=".48" stop-color="#fff0b0"/>
      <stop offset="1" stop-color="#a8752c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="blur"/>
      <feOffset dy="1.2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#soft-shadow)">
    <path d="M137 54 116 23l36 15L190 7l38 31 36-15-21 31-16 12H153z" fill="url(#gold)" stroke="#f5d77f" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="m116 23 20 31m92 0 20-31M152 38l38-31 38 31" fill="none" stroke="url(#shine)" stroke-width="1.5" opacity=".9"/>
    <path d="M137 58h106v10H137z" fill="url(#gold)" stroke="#e8c16c" stroke-width="1"/>
    <path d="M143 71h94" stroke="#8e622a" stroke-width="1.3" opacity=".8"/>
    <circle cx="116" cy="22" r="4" fill="#f8dfa0"/>
    <circle cx="190" cy="7" r="4.8" fill="#fff0b2"/>
    <circle cx="264" cy="22" r="4" fill="#f8dfa0"/>
    <circle cx="152" cy="38" r="2.5" fill="#fff0b2"/>
    <circle cx="228" cy="38" r="2.5" fill="#fff0b2"/>
  </g>
  <text x="190" y="116" text-anchor="middle" fill="url(#gold)" stroke="#80551f" stroke-width=".65" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="59" font-weight="700" letter-spacing="1.4" textLength="328" lengthAdjust="spacingAndGlyphs">PRESTIGE</text>
  <path d="M139 126h30m72 0h30" stroke="url(#shine)" stroke-width="1" opacity=".55"/>
  <text x="190" y="141" text-anchor="middle" fill="#f2f0e9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="500" letter-spacing="8.2">LIVE RP</text>
</svg>
